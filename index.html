<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Gigabank — Простой вариант</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #eef2f5;
      color: #333;
      margin: 0;
      padding: 10px;
    }
    header {
      background-color: #dcdcdc;
      border: 1px solid #999;
      padding: 15px;
      text-align: center;
    }
    .logo {
      font-weight: bold;
      font-size: 20px;
      cursor: pointer;
    }
    main {
      max-width: 600px;
      margin: 20px auto;
      padding: 20px;
      background: #fff;
      border: 1px solid #bbb;
    }
    h1, h2 {
      margin: 0 0 15px 0;
      font-size: 18px;
      text-transform: uppercase;
    }
    p {
      margin: 5px 0;
      font-size: 13px;
      color: #555;
    }
    input {
      width: 100%;
      padding: 8px;
      border: 1px solid #999;
      box-sizing: border-box; /* чтобы padding не ломал ширину */
      margin-bottom: 10px;
    }
    button {
      display: block;
      width: 100%;
      padding: 10px;
      background-color: #ddd;
      border: 1px solid #888;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 10px;
    }
    button:hover {
      background-color: #ccc;
    }
    .card-box {
      background: #f9f9f9;
      border: 2px solid #aaa;
      padding: 15px;
      text-align: center;
      margin-bottom: 20px;
    }
    .card-number {
      font-family: 'Courier New', monospace;
      font-size: 16px;
      letter-spacing: 4px;
      margin: 10px 0;
      color: #222;
    }
    .balance-big {
      font-size: 24px;
      font-weight: bold;
      color: #006600;
      text-align: center;
      margin: 20px 0;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo" onclick="showPage('register')">Denkoff Bank</div>
    <div id="header-info" class="hidden" style="float:right; margin-top:4px;">
      <span>Баланс: <strong id="header-balance">0 ₽</strong></span>
      <button onclick="logout()" style="width:auto; padding:4px 10px; margin-left:10px;">Выйти</button>
    </div>
  </header>

  <main>
    <!-- Страница регистрации -->
    <div id="page-register">
      <h1>Добро пожаловать</h1>
      <p>Создайте аккаунт, чтобы начать пользоваться банком.</p>
      <input type="text" id="user-name" placeholder="Ваше имя (например, Иван)">
      <button onclick="createAccount()">Создать аккаунт</button>
    </div>

    <!-- Главная страница -->
    <div id="page-home" class="hidden">
      <div class="card-box">
        <div style="text-align:left; font-size:12px; color:#666;">Denkoff<br>Виртуальная карта</div>
        <div class="card-number" id="card-display">0000 0000 0000 0000</div>
        <div style="text-align:right; font-size:12px; color:#666;">
          <span id="name-display">YOUR NAME</span><br>
          12/30
        </div>
      </div>

      <div>
        <p style="text-align:center;">Ваш баланс</p>
        <div class="balance-big"><span id="balance-display">0</span> ₽</div>
      </div>

      <button onclick="topUp()">Пополнить счёт (+1000 ₽)</button>
      <button onclick="transfer()">Перевести деньги (−500 ₽)</button>

      <div style="margin-top:20px; padding:15px; background:#f0f0f0; border:1px solid #ccc;">
        <h2>Профиль</h2>
        <p><strong>Имя:</strong> <span id="profile-name">-</span></p>
        <p><strong>Номер карты:</strong> <span id="profile-card" style="font-family:'Courier New',monospace;">-</span></p>
        <p><strong>Баланс:</strong> <span id="profile-balance">-</span> ₽</p>
      </div>
    </div>
  </main>

  <script>
    // Простая логика на чистом JS
    const STORAGE_KEY = 'gigabank_simple';

    function getData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        return null;
      }
    }

    function saveData(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function showPage(pageName) {
      document.getElementById('page-register').classList.add('hidden');
      document.getElementById('page-home').classList.add('hidden');

      if (pageName === 'register') {
        document.getElementById('page-register').classList.remove('hidden');
        document.getElementById('header-info').classList.add('hidden');
      } else if (pageName === 'home') {
        document.getElementById('page-home').classList.remove('hidden');
        document.getElementById('header-info').classList.remove('hidden');
        renderHome();
      }
    }

    function createAccount() {
      const name = document.getElementById('user-name').value.trim();
      if (!name || name.length < 2) {
        alert('Пожалуйста, введите имя (минимум 2 буквы).');
        return;
      }

      const account = {
        name: name,
        card: generateCard(),
        balance: 500 // стартовый бонус
      };

      saveData(account);
      alert('Аккаунт создан! Начислено 500 ₽.');
      showPage('home');
    }

    function generateCard() {
      let parts = [];
      for (let i = 0; i < 4; i++) {
        parts.push(String(Math.floor(1000 + Math.random() * 9000)));
      }
      return parts.join(' ');
    }

    function renderHome() {
      const data = getData();
      if (!data) {
        showPage('register');
        return;
      }

      // Обновляем данные на странице
      document.getElementById('card-display').textContent = data.card;
      document.getElementById('name-display').textContent = data.name.toUpperCase();
      document.getElementById('balance-display').textContent = data.balance;
      document.getElementById('header-balance').textContent = data.balance + ' ₽';

      document.getElementById('profile-name').textContent = data.name;
      document.getElementById('profile-card').textContent = data.card;
      document.getElementById('profile-balance').textContent = data.balance;
    }

    function topUp() {
      const data = getData();
      if (!data) return;
      data.balance += 1000;
      saveData(data);
      renderHome();
      alert('Счёт пополнен на 1000 ₽. Новый баланс: ' + data.balance + ' ₽');
    }

    function transfer() {
      const data = getData();
      if (!data) return;

      if (data.balance < 500) {
        alert('Недостаточно средств для перевода.');
        return;
      }

      data.balance -= 500;
      saveData(data);
      renderHome();
      alert('Переведено 500 ₽. Остаток: ' + data.balance + ' ₽.');
    }

    function logout() {
      localStorage.removeItem(STORAGE_KEY);
      showPage('register');
    }

    // При загрузке проверяем, есть ли аккаунт
    window.addEventListener('DOMContentLoaded', () => {
      const data = getData();
      if (data) {
        showPage('home');
      } else {
        showPage('register');
      }
    });
  </script>
</body>
</html>
